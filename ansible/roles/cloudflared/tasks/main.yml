# Cloudflare Tunnel: cloudflared chủ động kết nối RA Cloudflare (QUIC/443) nên
# KHÔNG cần mở cổng vào nào trên router/tường lửa. Hai connector cùng một tunnel
# (vps-mon + vps-app) -> một máy hỏng, tên miền vẫn vào được.
- name: Khóa ký gói Cloudflare
  ansible.builtin.get_url:
    url: https://pkg.cloudflare.com/cloudflare-main.gpg
    dest: /usr/share/keyrings/cloudflare-main.gpg
    mode: "0644"

- name: Kho gói cloudflared
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/cloudflared.list
    content: "deb [signed-by=/usr/share/keyrings/cloudflare-main.gpg] https://pkg.cloudflare.com/cloudflared any main\n"
    mode: "0644"

- name: Cài cloudflared
  ansible.builtin.apt:
    name: cloudflared
    update_cache: true
    state: present

- name: Thư mục cấu hình
  ansible.builtin.file:
    path: /etc/cloudflared
    state: directory
    mode: "0750"

- name: Thông tin xác thực tunnel (bí mật, lấy từ máy quản trị, không lên GitHub)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/{{ cloudflare_tunnel_id }}.json"
    dest: "/etc/cloudflared/{{ cloudflare_tunnel_id }}.json"
    mode: "0600"
  notify: restart cloudflared

- name: Quy tắc ingress của tunnel
  ansible.builtin.template:
    src: config.yml.j2
    dest: /etc/cloudflared/config.yml
    mode: "0644"
  notify: restart cloudflared

- name: Dịch vụ systemd cho cloudflared
  ansible.builtin.template:
    src: cloudflared.service.j2
    dest: /etc/systemd/system/cloudflared.service
    mode: "0644"
  notify: restart cloudflared

- name: Bật cloudflared
  ansible.builtin.systemd_service:
    name: cloudflared
    enabled: true
    state: started
    daemon_reload: true
