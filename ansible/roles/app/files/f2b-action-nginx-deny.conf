# Action fail2ban: chặn IP bằng dòng "deny <ip>;" trong nginx (kết hợp real_ip từ Cloudflare)
# LƯU Ý: trong file cấu hình fail2ban, " ;" (có khoảng trắng phía trước) là BẮT ĐẦU CHÚ THÍCH
# -> không nối lệnh bằng " ; " mà viết mỗi lệnh một dòng. Dùng đường dẫn tuyệt đối cho chắc.
[Definition]
_f = /etc/nginx/fail2ban/deny.conf
_reload = /usr/sbin/nginx -t -q && /usr/sbin/nginx -s reload
actionstart = /usr/bin/touch %(_f)s
actionstop  = /usr/bin/truncate -s 0 %(_f)s
              %(_reload)s
actioncheck =
actionban   = /usr/bin/grep -qxF 'deny <ip>;' %(_f)s || echo 'deny <ip>;' >> %(_f)s
              %(_reload)s
actionunban = /usr/bin/grep -vxF 'deny <ip>;' %(_f)s > %(_f)s.tmp || true
              /usr/bin/cat %(_f)s.tmp > %(_f)s
              /usr/bin/rm -f %(_f)s.tmp
              %(_reload)s
