# Action fail2ban: chặn IP bằng dòng "deny <ip>;" trong nginx (kết hợp real_ip từ Cloudflare)
[Definition]
_f = /etc/nginx/fail2ban/deny.conf
actionstart = touch %(_f)s
actionstop  = : > %(_f)s ; nginx -s reload
actioncheck =
actionban   = grep -qxF 'deny <ip>;' %(_f)s || echo 'deny <ip>;' >> %(_f)s ; nginx -s reload
actionunban = grep -vxF 'deny <ip>;' %(_f)s > %(_f)s.tmp ; cat %(_f)s.tmp > %(_f)s ; rm -f %(_f)s.tmp ; nginx -s reload
