# Action fail2ban: chặn IP bằng dòng "deny <ip>;" trong nginx (kết hợp real_ip từ Cloudflare)
# Dùng ĐƯỜNG DẪN TUYỆT ĐỐI: môi trường của fail2ban không có /usr/sbin trong PATH
[Definition]
_f = /etc/nginx/fail2ban/deny.conf
_reload = /usr/sbin/nginx -t -q && /usr/sbin/nginx -s reload
actionstart = /usr/bin/touch %(_f)s
actionstop  = /usr/bin/truncate -s 0 %(_f)s ; %(_reload)s
actioncheck =
actionban   = /usr/bin/grep -qxF 'deny <ip>;' %(_f)s || echo 'deny <ip>;' >> %(_f)s ; %(_reload)s
actionunban = /usr/bin/grep -vxF 'deny <ip>;' %(_f)s > %(_f)s.tmp ; /usr/bin/cat %(_f)s.tmp > %(_f)s ; /usr/bin/rm -f %(_f)s.tmp ; %(_reload)s
