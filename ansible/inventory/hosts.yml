# Inventory — Ansible chạy trên vps-mon (control node), đi qua VÙNG DỮ LIỆU (Data-Net)
# bằng tài khoản dịch vụ "deploy" (chỉ khóa SSH, chỉ được SSH từ 192.168.250.23).
all:
  vars:
    ansible_user: deploy
    ansible_ssh_private_key_file: ~/.ssh/deploy_ed25519
    ansible_python_interpreter: /usr/bin/python3
  children:
    app:
      hosts:
        vps-app-2424802010066: { ansible_host: 192.168.250.21, role_key: app }
    data:
      hosts:
        vps-data-2424802010066: { ansible_host: 192.168.250.22, role_key: data }
    mon:
      hosts:
        vps-mon-2424802010066: { ansible_host: 192.168.250.23, role_key: mon }
